[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeguard"
version = "1.0.0"
description = "Scan authorization: allowlist, ownership proof and named consent, with DNS screen against SSRF and rebinding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["security", "authorization", "scope", "ssrf", "compliance"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scopeguard = "scopeguard.cli:main"

[tool.setuptools.packages.find]
include = ["scopeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
